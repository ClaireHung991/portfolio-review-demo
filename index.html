<style>
:root{
  --paper:#EBEFF3;--surface:#FFFFFF;--surface-2:#F5F7F9;--ink:#14212F;--muted:#5A6777;--line:#D5DDE5;
  --accent:#0C6A61;--accent-ink:#FFFFFF;--accent-soft:#DCEEEB;
  --warn:#935700;--warn-soft:#FCF0DA;--bad:#A33535;--bad-soft:#F9E5E5;--ok:#1C7646;--ok-soft:#E0F1E7;
  --focus:#2563A8;--shadow:0 1px 2px rgba(20,33,47,.06),0 4px 16px rgba(20,33,47,.05);
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E151C;--surface:#16202A;--surface-2:#1C2833;--ink:#E4EBF1;--muted:#99A7B5;--line:#2B3946;
  --accent:#3DB0A2;--accent-ink:#06201C;--accent-soft:#143833;
  --warn:#E2A54B;--warn-soft:#382A13;--bad:#E27C7C;--bad-soft:#391D1D;--ok:#5BC48B;--ok-soft:#163224;
  --focus:#7FB2EE;--shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#0E151C;--surface:#16202A;--surface-2:#1C2833;--ink:#E4EBF1;--muted:#99A7B5;--line:#2B3946;
  --accent:#3DB0A2;--accent-ink:#06201C;--accent-soft:#143833;
  --warn:#E2A54B;--warn-soft:#382A13;--bad:#E27C7C;--bad-soft:#391D1D;--ok:#5BC48B;--ok-soft:#163224;
  --focus:#7FB2EE;--shadow:0 1px 2px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3,h4{margin:0;font-weight:600}
p{margin:0}
img,svg,canvas{max-width:100%}

/* top bar */
.top{display:flex;align-items:center;gap:16px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.2}
.brand b{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:-.01em}
.brand span{font-size:12.5px;color:var(--muted)}
.top .spacer{flex:1}
.rm{display:flex;align-items:center;gap:10px;font-size:13.5px}
.rm .av{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:13px}
.rm small{display:block;color:var(--muted);font-size:12px}
.ai-pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.ai-pill.on{border-color:var(--accent);color:var(--accent)}

/* step rail */
.rail{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto}
.rail button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;padding:14px 20px;border-right:1px solid var(--line);position:relative;min-width:190px}
.rail button:last-child{border-right:0}
.rail button[disabled]{cursor:not-allowed;opacity:.45}
.rail button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
.rail .n{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--muted)}
.rail .t{display:flex;flex-direction:column;line-height:1.25}
.rail .t b{font-size:14px;font-weight:600}
.rail .t span{font-size:12.5px;color:var(--muted)}
.rail button.cur{background:var(--surface-2)}
.rail button.cur::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--accent)}
.rail button.cur .n{border-color:var(--accent);color:var(--accent)}
.rail button.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rail button.stale .n{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.rail button.stale .t span{color:var(--warn);font-weight:500}

main{padding:22px 24px 28px;max-width:1440px;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.page-head h1{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.01em}
.page-head p{color:var(--muted);font-size:14px;margin-top:2px;max-width:70ch}

.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.card>.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.card>.hd h3{font-size:14.5px}
.card>.bd{padding:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.big{padding:12px 20px;font-size:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:none}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.chip.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}

.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:10px;margin-bottom:16px;border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);flex-wrap:wrap}
.banner.info{border-color:var(--line);background:var(--surface)}
.banner.ok{border-color:var(--ok);background:var(--ok-soft)}
.banner b{font-weight:600}

/* client list */
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.clients{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.client{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.client:hover{background:var(--surface-2)}
.client.sel{border-color:var(--accent);background:var(--accent-soft)}
.client .av{width:36px;height:36px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.client div{flex:1}
.client b{display:block;font-weight:600}
.client span{font-size:12.5px;color:var(--muted)}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 14px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{all:unset;cursor:pointer;padding:8px 14px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
textarea.input{width:100%;min-height:110px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);resize:vertical;line-height:1.5}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--accent)}
.files{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-weight:500;color:var(--muted);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tr:last-child td{border-bottom:0}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.gen-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* workspace: chat left, content right */
.work>*,.grid2>*{min-width:0}
.work{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:18px;align-items:start}
.chat{position:sticky;top:12px;display:flex;flex-direction:column;height:calc(100vh - 150px);min-height:480px}
.chat .hd{display:flex;align-items:center;gap:10px;justify-content:flex-start}
.chat .bot{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.chat .hd b{display:block;font-size:14px}
.chat .hd small{display:block;font-size:12px;color:var(--muted)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:9px 12px;border-radius:10px;font-size:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.rm{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.agent{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;text-align:center;padding:2px 8px}
.msg ul{margin:6px 0 0;padding-left:18px;white-space:normal}
.msg .vtag{display:inline-block;margin-top:6px}
.working{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.dots{display:inline-flex;gap:3px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.7}}
.compose{border-top:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:8px}
.compose textarea{width:100%;min-height:64px;max-height:160px;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface)}
.compose .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.sugg button{all:unset;cursor:pointer;font-size:12.5px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.vtabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vtabs button{all:unset;cursor:pointer;padding:5px 11px;border-radius:7px;font-size:13px;border:1px solid var(--line)}
.vtabs button.on{border-color:var(--ink);font-weight:600}
.vtabs button .a{color:var(--ok);font-weight:600}

/* analysis dashboard */
.sec{padding:18px 18px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-h .no{font-family:var(--serif);color:var(--muted);font-size:15px;min-width:20px}
.sec-h h3{font-family:var(--serif);font-size:17px;font-weight:600}
.sec-h .chip{margin-left:auto}
.comment{font-size:14.5px;line-height:1.6;max-width:78ch;margin-top:12px}
.comment.changed{background:var(--accent-soft);border-left:3px solid var(--accent);padding:8px 12px;border-radius:0 6px 6px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2)}
.kpi>span{display:block;font-size:12.5px;color:var(--muted)}
.kpi b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi>small{font-size:12px;color:var(--muted)}
.charts2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.chart-box{position:relative;height:240px}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:8px;background:var(--surface-2)}
.flag.breach{background:var(--bad-soft)}
.flag.warn{background:var(--warn-soft)}
.flag .chip{flex:none}
.headlines{margin:0;padding-left:18px;font-size:14.5px;line-height:1.6}
.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.rec{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface-2)}
.rec.changed{border-color:var(--accent);background:var(--accent-soft)}
.rec b{display:block;margin-bottom:4px}
.rec p{font-size:13.5px}
.rec .prods{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}

/* deck */
.stage{padding:16px;background:var(--surface-2)}
.frame{width:100%;aspect-ratio:16/9;position:relative;overflow:hidden;border-radius:6px;box-shadow:0 2px 12px rgba(20,33,47,.16);background:#fff}
.frame>.slide{position:absolute;top:0;left:0;transform-origin:0 0}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 16px}
.thumb{all:unset;cursor:pointer;flex:none;width:168px;display:flex;flex-direction:column;gap:5px}
.thumb .frame{box-shadow:none;border:2px solid var(--line);border-radius:5px}
.thumb.on .frame{border-color:var(--accent)}
.thumb span{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.thumb:focus-visible .frame{outline:2px solid var(--focus);outline-offset:2px}

/* slide (fixed light print palette) */
.slide{width:1280px;height:720px;background:#fff;color:#14212F;font-family:"IBM Plex Sans",Arial,sans-serif;position:relative;overflow:hidden}
.slide .bar{position:absolute;left:0;top:0;bottom:0;width:14px;background:#0C6A61}
.slide .kick{position:absolute;left:58px;top:30px;font-size:15px;color:#5A6777}
.slide .ttl{position:absolute;left:58px;top:58px;right:58px;font-family:"IBM Plex Serif",Georgia,serif;font-size:38px;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.slide .body{position:absolute;left:58px;right:58px;top:142px;bottom:62px}
.slide .foot{position:absolute;left:58px;right:58px;bottom:22px;display:flex;justify-content:space-between;font-size:13px;color:#7A8694;border-top:1px solid #E1E6EB;padding-top:10px}
.slide ul.b{margin:0;padding-left:24px;font-size:21px;line-height:1.45}
.slide ul.b li{margin-bottom:12px}
.slide .take{position:absolute;left:58px;right:58px;bottom:66px;font-size:19px;color:#0C6A61;font-weight:500;border-left:4px solid #0C6A61;padding-left:14px}
.slide .cols{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.slide .cols.wide{grid-template-columns:1.25fr 1fr}
.slide .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.slide .tile{border:1px solid #DDE3E9;border-radius:10px;padding:18px 20px;background:#F6F8FA}
.slide .tile>span{display:block;font-size:16px;color:#5A6777}
.slide .tile b{display:block;font-size:32px;font-weight:600;margin-top:4px}
.slide table.st{width:100%;border-collapse:collapse;font-size:17px}
.slide table.st th{text-align:left;color:#5A6777;font-weight:500;padding:9px 10px;border-bottom:2px solid #DDE3E9}
.slide table.st td{padding:9px 10px;border-bottom:1px solid #E6EAEE;vertical-align:top}
.slide table.st .n{text-align:right;white-space:nowrap}
.slide .pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:14px;font-weight:600}
.slide .pill.ok{background:#E0F1E7;color:#1C7646}.slide .pill.warn{background:#FCF0DA;color:#935700}.slide .pill.bad{background:#F9E5E5;color:#A33535}
.slide .cv{position:relative;width:100%;height:100%}
.slide .rc{border:1px solid #DDE3E9;border-radius:10px;padding:16px 18px;background:#F6F8FA}
.slide .rc b{display:block;font-size:20px;margin-bottom:6px}
.slide .rc p{font-size:16px;line-height:1.45;color:#2A3A4A}
.slide .rc small{display:block;margin-top:8px;font-size:14px;color:#0C6A61}
.slide.cover{background:#0F2A33;color:#fff}
.slide.cover .band{position:absolute;left:0;right:0;bottom:0;height:12px;background:#3DB0A2}
.slide .pos{color:#1C7646}.slide .neg{color:#A33535}

/* step 4 */
.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
.opt{all:unset;cursor:pointer;display:flex;gap:14px;align-items:flex-start;padding:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.opt .ic{width:38px;height:38px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--accent);flex:none}
.opt .tx b{display:block;font-size:15.5px;color:var(--ink)}
.opt .tx span{display:block;font-size:13.5px;color:var(--muted)}
.email{display:flex;flex-direction:column}

/* dates: stored as ISO yyyy-mm-dd, shown as "30 Sep 2026" */

  if (v == null) return ""; if (v instanceof Date && !isNaN(v)) return v.toISOString().slice(0, 10);
  const s = String(v).trim(); if (!s) return "";

  const mi = t => _MN.findIndex(x => x.toLowerCase() === t.slice(0, 3).toLowerCase()) + 1;
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return mk(+m[1], +m[2], +m[3]);

const FREQS = [{ id:"Y", label:"Yearly" }, { id:"H", label:"Bi-annual" }, { id:"Q", label:"Quarterly" }, { id:"M", label:"Monthly" }];
const FREQ = Object.fromEntries(FREQS.map(f => [f.id, f.label]));
const YEARS = [2026, 2025];
const partsOf = f => f === "Y" ? [{ v:0, l:"Full year" }] : f === "H" ? [{ v:1, l:"H1 (Jan to Jun)" }, { v:2, l:"H2 (Jul to Dec)" }]
  : f === "Q" ? [1,2,3,4].map(q => ({ v:q, l:`Q${q}` })) : MN_FULL.map((m, i) => ({ v:i + 1, l:m }));
function periodOf(spec) {
  const { freq, year, part } = spec; let s, e, label;
  if (freq === "Y") { s = mIdx(year, 1); e = mIdx(year, 12); label = `${year}`; }
  else if (freq === "H") { s = mIdx(year, part === 1 ? 1 : 7); e = s + 5; label = `${year} H${part}`; }
  else if (freq === "Q") { s = mIdx(year, (part - 1) * 3 + 1); e = s + 2; label = `${year} Q${part}`; }
  else { s = mIdx(year, part); e = s; label = `${MN[part - 1]} ${year}`; }
  const noData = s > LAST || e < 0, partial = !noData && e > LAST, eA = Math.min(e, LAST);
  const range = `${dStr(mStartDate(s))} to ${dStr(mEndDate(e))}`;
  return { id:`${freq}-${year}-${part}`, freq, freqLabel:FREQ[freq], year, part, label, s, e:eA, eFull:e, noData, partial, range,
    dataRange: noData ? "" : `${dStr(mStartDate(s))} to ${dStr(mEndDate(eA))}` };
}

const _loaded = {};
function loadLib(k) { return _loaded[k] || (_loaded[k] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = LIBS[k]; s.onload = res; s.onerror = () => { delete _loaded[k]; rej(new Error("Could not load " + k)); }; document.head.appendChild(s); })); }
async function saveFile(filename, blob) {
  if (DL) { try { await DL.save({ filename, data:blob }); return true; } catch (e) { if (e && e.code === "declined") { toast("Download cancelled"); return false; } toast("Download not available here (" + (e && e.code || "error") + ")"); return false; } }
  if (window.claude) { toast("Downloads are not available in this view"); return false; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return true;
}
function deckCtx(r) { const dk = r.deck, v = verOf(dk, dk.approvedV); return { M:metrics(r), slides:v.slides, A:verOf(r.analysis, v.basedOnAnalysisV).data }; }
async function exportPdf(r) {
  await Promise.all([loadLib("jspdf"), loadLib("h2c")]); if (document.fonts) await document.fonts.ready;
  const { M, slides, A } = deckCtx(r), off = $("#offscreen"), { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:"landscape", unit:"px", format:[1280, 720], hotfixes:["px_scaling"] });
  for (let i = 0; i < slides.length; i++) {
    off.innerHTML = slideHTML(slides[i], i, slides.length, r, M, A); drawSlideCharts(off, M);
    const canvas = await html2canvas(off.firstElementChild, { scale:1.5, backgroundColor:"#ffffff", logging:false });
    if (i) doc.addPage([1280, 720], "landscape");
    doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, 1280, 720);
    killCharts(off);
  }
  off.innerHTML = "";
  return doc.output("blob");
}

/* ============ file reading ============ */
async function zipText(file, kind) {
  await loadLib("jszip"); const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const strip = x => x.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'");
  if (kind === "pptx") {
    const names = Object.keys(zip.files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a, b) => +a.match(/\d+/)[0] - +b.match(/\d+/)[0]);
    let out = ""; for (const [i, n] of names.entries()) { const x = await zip.file(n).async("string");
      const paras = x.split("</a:p>").map(p => (p.match(/<a:t>([^<]*)<\/a:t>/g) || []).map(t => strip(t)).join("")).filter(Boolean);
      out += `Slide ${i + 1}: ${paras.join(" | ")}\n`; }
    return out;
  }
  const x = await zip.file("word/document.xml").async("string");
  return x.split("</w:p>").map(p => { const t = (p.match(/<w:t[^>]*>([^<]*)<\/w:t>/g) || []).map(s => strip(s)).join(""); const h = /w:pStyle w:val="(Heading|Title)[^"]*"/.test(p);
    return t ? (h ? "# " + t : t) : ""; }).filter(Boolean).join("\n");
}
async function readUpload(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  try {
    if (["txt","md","csv"].includes(ext)) return await file.text();
    if (["xlsx","xls"].includes(ext)) { await loadLib("xlsx"); const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
      return wb.SheetNames.map(n => `Sheet ${n}\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n"); }
    if (ext === "pdf") { await loadLib("pdfjs"); const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = LIBS.pdfworker;
      const pdf = await lib.getDocument({ data:new Uint8Array(await file.arrayBuffer()) }).promise; let out = "";
      for (let i = 1; i <= Math.min(pdf.numPages, 40); i++) { const pg = await pdf.getPage(i); const tc = await pg.getTextContent(); out += `Page ${i}: ` + tc.items.map(x => x.str).join(" ") + "\n"; }
      return out; }
    if (ext === "pptx" || ext === "docx") return await zipText(file, ext);
  } catch (e) { console.warn(e); }
  return "";
}
async function addFiles(list) {
  const r = R(); if (!r) return;
  toast("Reading files");
  for (const f of Array.from(list)) {
    if (r.inputs.files.some(x => x.name === f.name && x.size === f.size)) continue;
    const text = (await readUpload(f)).slice(0, 40000);
    r.inputs.files.push({ name:f.name, size:f.size, text });
    logEv(r, 1, `Material uploaded: ${f.name}${text ? "" : " (text could not be read)"}`);
  }
  render();
}

const EXT_HEAD = ["Asset name","Asset class","Region","Currency","Market value (SGD)","Value date","Institution"];
async function xlsxBlob(rows, sheet) { await loadLib("xlsx"); const ws = XLSX.utils.aoa_to_sheet(rows); ws["!cols"] = rows[0].map((_, i) => ({ wch: i === 0 ? 42 : 18 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheet); return new Blob([XLSX.write(wb, { type:"array", bookType:"xlsx" })], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }); }
function mapTemplateRows(aoa) {
  const hi = aoa.findIndex(row => row.some(c => /asset name|^name$/i.test(String(c).trim())) && row.some(c => /value/i.test(String(c))));
  if (hi < 0) return null;
  const h = aoa[hi].map(c => String(c).toLowerCase().trim()), col = re => h.findIndex(c => re.test(c));
  const ix = { name:col(/asset name|^name$/), asset:col(/class|type/), region:col(/region|country/), ccy:col(/curr|ccy/), value:col(/value \(|market value|^value$/), date:col(/date|as of/), inst:col(/institution|custodian|bank|broker/) };
  return aoa.slice(hi + 1).filter(row => row[ix.name]).map(row => cleanAsset({ name:row[ix.name], asset:row[ix.asset], region:ix.region >= 0 ? row[ix.region] : "", ccy:ix.ccy >= 0 ? row[ix.ccy] : "SGD", value:row[ix.value], date:ix.date >= 0 ? row[ix.date] : "", inst:ix.inst >= 0 ? row[ix.inst] : "" }));
}
async function parseExternal(file) {
  const r = R(), ext = file.name.split(".").pop().toLowerCase();
  let rows = null, text = "";
  if (["xlsx","xls","csv"].includes(ext)) {
    try { await loadLib("xlsx"); const wb = ext === "csv" ? XLSX.read(await file.text(), { type:"string" }) : XLSX.read(await file.arrayBuffer(), { type:"array" });
      for (const n of wb.SheetNames) { const aoa = XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, raw:false, defval:"" }); rows = mapTemplateRows(aoa); if (rows && rows.length) break; text += XLSX.utils.sheet_to_csv(wb.Sheets[n]) + "\n"; }
    } catch (e) { console.warn(e); }
    if (rows && rows.length) { r.extPending = { file:file.name, via:"template", rows }; render(); return; }
  }
  if (!text) text = await readUpload(file);
  if (!text.trim()) { toast("The file could not be read. Try the Excel template."); return; }
  if (!SAMPLE) { toast("Reading this kind of file needs live AI. In demo mode, use the Excel template or Use sample."); return; }
  try { const res = await runAgent("ext", `Reading assets from ${file.name}`, promptExternal(file.name, text));
    const got = (res && Array.isArray(res.assets) ? res.assets : []).map(cleanAsset);
    if (!got.length) { toast("No assets were found in the file."); render(); return; }
    r.extPending = { file:file.name, via:"AI", rows:got };
  } catch (e) { toast(errText(e)); }
  render();
}

  extUseSample: () => { const r = R(), c = CLIENT[r.clientId]; r.extPending = { file:`sample data for ${c.name}`, via:"template", rows:c.external.map(cleanAsset) }; gdone("m2-sample"); render();
    const p = $(".pending"); if (p) p.scrollIntoView({ block:"center", behavior:"smooth" }); },
  peDel: el => { R().extPending.rows.splice(+el.dataset.i, 1); render(); },
  peCancel: () => { R().extPending = null; render(); },
  peOk: () => { const r = R(), p = r.extPending, rows = p.rows.map(a => ({ ...a, value:Math.round(+a.value || 0), valueCcy:"SGD" }));
    r.inputs.external.push(...rows); r.extPending = null; gdone("m2-upload"); logEv(r, 1, `External assets added from ${p.file}: ${rows.length} item${rows.length > 1 ? "s" : ""}, ${money(sum(rows.map(a => a.value)))}`); render(); },
  extDel: el => { const r = R(), i = r.inputs.external.findIndex(a => a.id === el.dataset.id), a = r.inputs.external.splice(i, 1)[0]; logEv(r, 1, `External asset removed: ${a.name}`); render(); },
  olEdit: () => { UI.modal = { type:"outline", rows:clone(R().outline), note:"" }; gdone("m3-open"); paintModal(); },
  olUp: el => { const i = +el.dataset.i, a = mRows(); [a[i - 1], a[i]] = [a[i], a[i - 1]]; paintModal(); },
  olDown: el => { const i = +el.dataset.i, a = mRows(); [a[i + 1], a[i]] = [a[i], a[i + 1]]; paintModal(); },
  olDel: el => { mRows().splice(+el.dataset.i, 1); paintModal(); },
  olAdd: () => { mRows().push({ id:"c-" + uid(), type:"custom", title:"New section", desc:"" }); paintModal(); const ins = $$('.ol-row input[data-inp="olTitle"]'); if (ins.length) { ins[ins.length - 1].focus(); ins[ins.length - 1].select(); } },
  olReset: () => { UI.modal.rows = DEFAULT_OUTLINE(); UI.modal.note = "Reset to the default template. Save to apply."; UI.modal.noteBad = false; paintModal(); },
  olUpload: () => $("#olFile").click(),
  olUseSample: () => outlineFromSample(),
  olSave: () => { const r = R(), rows = mRows().map(s => ({ ...s, title:(s.title || "").trim() || SECTION_TYPES[s.type].label }));
    const changed = JSON.stringify(rows) !== JSON.stringify(r.outline);
    r.outline = rows; S.outlines[r.clientId] = clone(rows); UI.modal = null;
    gdone("m3-save");
    if (changed) logEv(r, 1, `Report outline updated (${rows.length} sections) and saved as ${CLIENT[r.clientId].name}'s default`);
    toast(changed ? "Outline saved" : "No changes"); render(); },
  stop: () => busy && busy.ctl.abort(),
  sugg: el => { const ta = $("#ta-" + el.dataset.chat); if (ta && !ta.disabled) { ta.value = el.dataset.text; ta.focus(); } },
  send: el => { const k = el.dataset.chat, ta = $("#ta-" + k), msg = ta && ta.value.trim(); if (!msg || busy) return; ta.value = "";
    if (k === "a1") chatA1(msg); else if (k === "a2") chatA2(msg); else chatA3(msg); },
  viewA: el => { R().analysis.view = +el.dataset.v; render(); },
  viewD: el => { R().deck.view = +el.dataset.v; S.deckSel = 0; render(); },
  approveA: () => { const r = R(), an = r.analysis; an.approvedV = an.view; gdone("m4-approveA"); logEv(r, 2, `Analysis v${an.view} approved by RM`, "a-appr");
    if (!r.deck.versions.length) genDeck(false); else { S.step = 3; render(); } },
  genD: () => genDeck(false),
  refreshD: () => genDeck(true),
  approveD: () => { const r = R(), dk = r.deck; dk.approvedV = dk.view; gdone("m4-approveD"); logEv(r, 3, `Deck v${dk.view} approved by RM`, "d-appr"); S.step = 4; render(); window.scrollTo(0, 0); },
  slideSel: el => { S.deckSel = +el.dataset.i; render(); },
  slidePrev: () => { S.deckSel = Math.max(0, S.deckSel - 1); render(); },
  slideNext: () => { S.deckSel++; render(); },
  mode: el => { const r = R(), st = status(r); r.comms.mode = el.dataset.mode; if (el.dataset.mode === "email") gdone("m5-email"); if (r.comms.mode === "email" && !r.comms.email && st.s3Approved) genEmail(); else render(); },
  genE: () => genEmail(),
  refreshE: async () => { const r = R(); if (r.comms.email && r.comms.email.edited && !(await confirmDlg("Replace the email draft?", "A new draft is written for the approved deck. Your manual edits to the current draft will be replaced.", "Replace draft"))) return;
    r.comms.chat.push({ role:"sys", text:`Refreshing the draft for Deck v${r.deck.approvedV}.` }); genEmail(); },
  sendEmail: async () => { const r = R(), M = metrics(r), e = r.comms.email;
    if (!(await confirmDlg("Send this email?", `It goes to ${M.client.name} <${M.client.email}> with ${attachName(r)} attached. In this prototype, sending is simulated.`, "Send"))) return;
    e.sentAt = nowISO(); r.comms.shares.push({ type:"email", to:M.client.email, at:e.sentAt, deckV:r.deck.approvedV });
    logEv(r, 4, `Review shared with client by email, Deck v${r.deck.approvedV} (simulated send)`, "share"); gdone("m5-send"); toast("Email sent"); render(); },
  newEmail: () => { R().comms.email.sentAt = null; render(); },
  dl: async el => { const r = R(), fmt = el.dataset.fmt, st$ = $("#dlStatus"); if (busy) return;
    $$('[data-act="dl"]').forEach(b => b.disabled = true); if (st$) st$.textContent = fmt === "pdf" ? "Rendering slides to PDF" : "Building the PowerPoint file";
    try { const blob = fmt === "pdf" ? await exportPdf(r) : await exportPptx(r);
      const base = attachName(r).replace(/\.pdf$/, ""), ok = await saveFile(`${base}.${fmt}`, blob);
      if (ok) { gdone("m5-download"); logEv(r, 4, `Downloaded ${fmt === "pdf" ? "PDF" : "PowerPoint"}, Deck v${r.deck.approvedV}`); if (st$) st$.textContent = "Downloaded. Record the channel once you've shared it."; }
      else if (st$) st$.textContent = "";
    } catch (e) { console.error(e); if (st$) st$.textContent = "The file could not be created. Check your connection and try again."; }
    $$('[data-act="dl"]').forEach(b => b.disabled = false); paintLog(); save(); },
  markShared: () => { const r = R(), ch = $("#chan").value; r.comms.shares.push({ type:"channel", channel:ch, at:nowISO(), deckV:r.deck.approvedV });
    logEv(r, 4, `Review shared via ${ch}, Deck v${r.deck.approvedV}`, "share"); toast("Marked as shared via " + ch); render(); },
  logToggle: () => { S.logOpen = !S.logOpen; if (S.logOpen) gdone("m5-log"); paintLog(); save(); },
  theme: el => { S.theme = el.dataset.v; applyTheme(); render(); },
  guideToggle: () => { S.guide.open = !S.guide.open; if (S.guide.open && mDone(MISSIONS.find(m => m.id === S.guide.openM) || MISSIONS[0])) { const nx = MISSIONS.find(m => !mDone(m)); if (nx) S.guide.openM = nx.id; } paintTop(); paintGuide(); save(); },
  gOpen: el => { S.guide.openM = S.guide.openM === el.dataset.id ? null : el.dataset.id; paintGuide(); save(); },
  gPhrase: async el => { const p = MISSIONS.find(m => m.id === el.dataset.m).phrases[+el.dataset.j];
    const target = p.to === "insights" ? $("#insights") : p.to === "facts" ? $('[data-inp="olFacts"]') : $("#ta-" + p.to);
    if (target && !target.disabled) { target.value = p.text; target.dispatchEvent(new Event("input", { bubbles:true })); target.dispatchEvent(new Event("change", { bubbles:true })); target.focus(); target.scrollIntoView({ block:"center" }); toast(p.to === "insights" ? "Added to your insights" : p.to === "facts" ? "Added to the section facts. Save the outline to apply." : `Pasted into ${p.label}'s chat. Press Send.`); return; }
    const ok = await copyText(p.text); toast(p.to === "facts" ? "Open Edit outline and use the sample template first, then click Use again." : ok ? `Copied. Paste it into ${p.label === "Insight" ? "Insights and judgment calls in Step 1" : p.label + "'s chat"}.` : "Select and copy the text from the guide."); },
  gGo: el => { const id = el.dataset.id;
    if (id === "m1") { S.view = "list"; render(); window.scrollTo(0, 0); return; }
    if (id === "m2") { const ex = guideReview(); if (ex) { openReview(ex.id); S.step = 1; render(); toast("Lim Wei Ming's 2026 Q3 review already exists, so it's opened here."); return; }
      S.view = "list"; render(); UI.modal = { type:"new", clientId:"C1", spec:{ freq:"Q", year:2026, part:3 }, q:"", hi:-1 }; paintModal(); return; }
    const r = guideReview(); if (!r) { toast("Complete Mission 2 first: create Lim Wei Ming's 2026 Q3 review."); return; }
    openReview(r.id); const st = status(r);
    S.step = id === "m3" ? 1 : id === "m4" ? (st.s2Approved && st.reach3 ? 3 : r.generated ? 2 : 1) : (st.reach4 ? 4 : entryStep(r)); render(); window.scrollTo(0, 0);
    if (id === "m4" && !r.generated) toast("Generate the review first (Mission 3)."); },
  gReset: async () => { if (!(await confirmDlg("Reset the demo?", "All reviews return to the starting sample set and guide progress is cleared. Your appearance setting is kept.", "Reset demo"))) return;
    S.reviews = {}; S.outlines = {}; seedAll(); S.view = "list"; S.currentId = null; S.step = 1; S.list = { q:"", sort:"updated", status:"all", archived:false };
    S.guide = { welcomed:true, open:true, openM:"m1", done:[], rid:null }; _metrics = {}; UI.modal = null; render(); window.scrollTo(0, 0); toast("Demo reset"); },
  wcGuide: () => { S.guide.welcomed = true; S.guide.open = true; UI.modal = null; render(); },
  wcExplore: () => { S.guide.welcomed = true; UI.modal = null; render(); const b = $("#guideBtn"); if (b) { b.classList.remove("pulse"); void b.offsetWidth; b.classList.add("pulse"); setTimeout(() => b.classList.remove("pulse"), 4600); }
    toast("You can open the Demo guide anytime from the top bar."); },
};
function setPeriod(r, sp) {
  const ex = findReview(r.clientId, sp, r.id);
  if (ex) { toast(`A ${periodOf(sp).label} review already exists for this client`); return; }
  r.period = sp; logEv(r, 1, `Review period changed to ${periodOf(sp).label}`); render();
}
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const f = ACT[el.dataset.act]; if (f) { e.preventDefault(); f(el); } });
$("#rail").addEventListener("click", e => { const b = e.target.closest("[data-step]"); if (b && !b.disabled) { if (R() && reviewStatus(R()) === "Shared" && +b.dataset.step !== S.step) gdone("m1-steps"); S.step = +b.dataset.step; render(); } });
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && UI.modal) { ACT.closeModal(); return; }
  if (e.target.id === "nrQ" && ["ArrowDown","ArrowUp","Enter"].includes(e.key)) { const m = UI.modal, list = nrMatches(m); if (!list.length) return; e.preventDefault();
    if (e.key === "ArrowDown") m.hi = Math.min(list.length - 1, (m.hi < 0 ? -1 : m.hi) + 1); else if (e.key === "ArrowUp") m.hi = Math.max(0, m.hi - 1);
    else { const c = list[Math.max(0, m.hi)]; if (c) m.clientId = c.id; }
    nrRefresh(); return; }
  if (e.target.matches(".compose textarea") && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); const k = e.target.id.slice(3); ACT.send({ dataset:{ chat:k } }); }
  if (e.target.matches(".drop") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); ACT.upload(); }
  if (e.target.matches("tr.lrow") && e.key === "Enter") openReview(e.target.dataset.id);
});
document.addEventListener("input", e => {
  const k = e.target.dataset.inp; if (!k) return;
  if (k === "nrQ") { UI.modal.q = e.target.value; UI.modal.hi = nrMatches(UI.modal).length ? 0 : -1; nrRefresh(); return; }
  if (k === "listq") { if (e.target.value.trim()) gdone("m1-search"); S.list.q = e.target.value; const pos = e.target.selectionStart; paintView(); save(); const s = $('[data-inp="listq"]'); if (s) { s.focus(); s.setSelectionRange(pos, pos); } return; }
  if (k === "olTitle" || k === "olDesc") { mRows()[+e.target.dataset.i][k === "olTitle" ? "title" : "desc"] = e.target.value; return; }
  if (k === "olFacts") { mRows()[+e.target.dataset.i].facts = e.target.value; if (e.target.value.trim()) gdone("m3-facts"); return; }
  const r = R(); if (!r) return;
  if (k === "insights") { r.inputs.insights = e.target.value; touch(r); save(); if (e.target.value.trim().length >= 8) gdone("m2-insight"); }
  if (k === "pe") { const row = r.extPending.rows[+e.target.dataset.i], f = e.target.dataset.f; row[f] = f === "value" ? (parseFloat(e.target.value.replace(/[^0-9.\-]/g, "")) || 0) : e.target.value; if (f === "value") row.valueCcy = "SGD"; save(); }
  if (k === "subj" && r.comms.email) { r.comms.email.subject = e.target.value; r.comms.email.edited = true; touch(r); save(); }
  if (k === "body" && r.comms.email) { r.comms.email.body = e.target.value; r.comms.email.edited = true; touch(r); save(); }
});
document.addEventListener("change", e => {
  const k = e.target.dataset.inp;
  if (e.target.id === "fileIn" && e.target.files.length) addFiles(e.target.files);
  if (e.target.id === "extFile" && e.target.files.length) { parseExternal(e.target.files[0]); e.target.value = ""; }
  if (e.target.id === "olFile" && e.target.files.length) { outlineFromFile(e.target.files[0]); e.target.value = ""; }
  if (k === "insights") { const r = R(); if (r && r.generated) { paintRail(); paintView(); } }
  if (k === "pe" && e.target.dataset.f === "date") { render(); }
  if (k === "lists") { S.list.status = e.target.value; render(); }
  if (k === "listsort") { S.list.sort = e.target.value; render(); }
  if (k === "listarch") { S.list.archived = e.target.checked; if (!S.list.archived && S.list.status === "Archived") S.list.status = "all"; render(); }
  if (k === "nrPart") { UI.modal.spec.part = +e.target.value; paintModal(); }
  if (k === "rpPart") { const r = R(), sp = clone(r.period); sp.part = +e.target.value; setPeriod(r, sp); }
  if (k === "olType") { const row = mRows()[+e.target.dataset.i], old = row.type; row.type = e.target.value;
    if (!row.title || row.title === SECTION_TYPES[old].label || row.title === "New section") row.title = SECTION_TYPES[row.type].label; paintModal(); }
  if (k === "olCopy" && e.target.value) { const src = S.reviews[e.target.value], other = src.clientId !== R().clientId; UI.modal.rows = clone(src.outline).map(x => other ? { ...x, facts:"" } : x); UI.modal.note = `Copied ${src.outline.length} sections from ${CLIENT[src.clientId].name}, ${periodTxt(src)}${other ? " (client specific facts were not copied)" : ""}. Save to apply.`; UI.modal.noteBad = false; gdone("m3-load"); paintModal(); }
});
document.addEventListener("dragover", e => { const d = e.target.closest && e.target.closest(".drop"); if (d) { e.preventDefault(); d.classList.add("over"); } });
document.addEventListener("dragleave", e => { const d = e.target.closest && e.target.closest(".drop"); if (d) d.classList.remove("over"); });
document.addEventListener("drop", e => { const d = e.target.closest && e.target.closest(".drop"); if (d) { e.preventDefault(); d.classList.remove("over"); addFiles(e.dataTransfer.files); } });

/* ============ init ============ */
if (!S.seeded) { S.reviews = {}; S.outlines = {}; seedAll(); }
if (S.view === "review" && !R()) S.view = "list";
if (!S.guide || !Array.isArray(S.guide.done)) S.guide = { welcomed:false, open:false, openM:"m1", done:[], rid:null };
if (!S.guide.welcomed) UI.modal = { type:"welcome" };
applyTheme();
try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if ((S.theme || "system") === "system") render(); }); } catch (e) {}
paintPill(); initAI(); render();
</script>
